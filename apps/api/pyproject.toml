[project]
name = "eyohe-api"
version = "0.1.0"
description = "Eyohe OSINT — local-first public-source intelligence platform (API, orchestrator, collectors, reporting)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic[email]>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "alembic>=1.13",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "redis>=5.0",
  "httpx>=0.27",
  "dnspython>=2.6",
  "argon2-cffi>=23.1",
  "structlog>=24.1",
  "prometheus-client>=0.20",
  "python-multipart>=0.0.9",
  "jinja2>=3.1",
  "markdown>=3.6",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "python-docx>=1.1",
  "pypdf>=4.3",
  "openpyxl>=3.1",
  "tldextract>=5.1",
  "python-dateutil>=2.9",
  "orjson>=3.10",
  "arq>=0.26",
  "croniter>=2.0",
  "sse-starlette>=2.1",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]
pdf = ["weasyprint>=62"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-python-dateutil",
  "types-Markdown",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eyohe"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "N", "W", "RUF"]
ignore = ["S101", "B008", "RUF012", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ASYNC", "E501"]
"eyohe/collectors/**" = ["E501"]
"eyohe/search/**" = ["E501"]
"alembic/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
exclude = ["alembic/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
