name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy eyohe
      - run: uv run pytest -q
        env:
          EYOHE_ENV: test

  api-postgres:
    name: API — tests on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eyohe
          POSTGRES_PASSWORD: eyohe
          POSTGRES_DB: eyohe
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U eyohe" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --all-extras
      - run: uv run alembic upgrade head
        env:
          DATABASE_URL: postgresql+asyncpg://eyohe:eyohe@127.0.0.1:5432/eyohe
      - run: uv run pytest -q
        env:
          EYOHE_ENV: test
          EYOHE_PG_TEST: "1"
          DATABASE_URL: postgresql+asyncpg://eyohe:eyohe@127.0.0.1:5432/eyohe

  web:
    name: Web — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx next typegen          # PageProps/LayoutProps/RouteContext are generated, not checked in
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
